[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-layout-scaffolder"
version = "0.2.0"
description = "A safe, maintainable Django layout scaffolder"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
scaffold-django-layout = "django_layout_scaffolder.cli:main"

[tool.setuptools.packages.find]
include = ["django_layout_scaffolder*"]

[tool.setuptools.package-data]
django_layout_scaffolder = [
    "assets/templates/*.html",
    "assets/templates/home/*.html",
    "assets/python/*.py",
    "assets/static/css/*.css",
]
