name: Staging audit

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: Public staging URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      STAGING_URL: ${{ inputs.staging_url }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Staging deployment smoke tests
        run: bash scripts/check_staging_smoke.sh

      - name: Lighthouse and Core Web Vitals
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json --collect.url="$STAGING_URL" --upload.target=filesystem

      - name: Accessibility
        run: npx --yes @axe-core/cli@4.10.2 "$STAGING_URL"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: staging-audit
          path: artifacts/lighthouse
          if-no-files-found: ignore
