name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-scan-build:
    # Pinned: ubuntu-latest is now 26.04, whose archive has no postgresql-client-16.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fsae_test
          POSTGRES_USER: fsae_app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fsae_app -d fsae_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-checks-0123456789
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver
      DB_ENGINE: postgres
      DB_NAME: fsae_test
      DB_USER: fsae_app
      DB_PASSWORD: ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DJANGO_SECURE_SSL_REDIRECT: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Match the postgres:16 service and the production image. An unpinned client can be
      # newer than the server, and a v17 pg_dump writes SET transaction_timeout, which
      # a v16 server rejects during pg_restore.
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Show PostgreSQL client version
        run: pg_dump --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit

      # Before Migrate, so the run proves default privileges cover tables created later.
      - name: Create the runtime database role
        env:
          PGPASSWORD: ci-password
          PSQL_COMMAND: psql -h 127.0.0.1
          DB_WEB_PASSWORD_FILE: ${{ runner.temp }}/db_web_password.txt
        run: |
          printf 'ciwebpassword0123456789abcdef' > "$DB_WEB_PASSWORD_FILE"
          bash scripts/apply_postgres_roles.sh
          bash scripts/apply_postgres_roles.sh   # must be idempotent

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Test
        run: python manage.py test

      - name: Runtime role can only read and write rows
        env:
          PGHOST: 127.0.0.1
          PGUSER: fsae_web
          PGPASSWORD: ciwebpassword0123456789abcdef
          PGDATABASE: fsae_test
        run: sh scripts/check_postgres_roles.sh

      - name: Site works as the runtime role
        env:
          DB_USER: fsae_web
          DB_PASSWORD: ciwebpassword0123456789abcdef
        run: python scripts/check_runtime_role.py

      - name: Compose gives web only the runtime credentials
        run: |
          mkdir -p secrets
          touch secrets/db_password.txt secrets/db_web_password.txt secrets/django_secret_key.txt
          docker compose --profile ops config --format json > "$RUNNER_TEMP/compose.json"
          jq -e '.services.web.environment.DB_USER == "fsae_web"' "$RUNNER_TEMP/compose.json"
          jq -e '[.services.web.secrets[].source] | index("db_password") == null' "$RUNNER_TEMP/compose.json"
          jq -e '.services.migrate.environment.DB_USER == "fsae_app"' "$RUNNER_TEMP/compose.json"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Source and frontend behavior checks
        run: |
          python scripts/verify_release.py
          node --test scripts/test_frontend.cjs
          bash scripts/test_restore_safety.sh
          bash scripts/test_apply_postgres_roles.sh
          bash scripts/test_staging_smoke.sh

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django checks
        run: python manage.py check

      - name: Deployment checks
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Backup test database
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: fsae_app
          PGPASSWORD: ci-password
          PGDATABASE: fsae_test
          BACKUP_DIR: artifacts/backups
        run: bash scripts/backup_postgres.sh

      - name: Create restore database
        env:
          PGPASSWORD: ci-password
        run: createdb -h 127.0.0.1 -U fsae_app fsae_restore

      - name: Restore test
        env:
          PGPASSWORD: ci-password
          RESTORE_DATABASE_URL: postgresql://fsae_app@127.0.0.1:5432/fsae_restore
        run: |
          backup_file="$(find artifacts/backups -name '*.dump' -print -quit)"
          BACKUP_FILE="$backup_file" bash scripts/restore_test_postgres.sh

      - name: Build image
        run: docker build --pull --tag es:${{ github.sha }} .
